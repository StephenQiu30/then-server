# Optional isolated synthetic-data dependencies. Normal development uses the
# services installed on macOS. Start this profile only when isolation is needed.

services:
  postgres:
    profiles: ["isolated-env"]
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_USER: then_dev
      POSTGRES_DB: then_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and replace every placeholder}
    ports:
      - "127.0.0.1:18432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U then_dev -d then_dev"]
      interval: 3s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  minio:
    profiles: ["isolated-env"]
    # Archived upstream; this historical build is not a production baseline.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: then_dev
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and replace every placeholder}
    ports:
      - "127.0.0.1:18900:9000"
      - "127.0.0.1:18901:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true

  redis:
    profiles: ["isolated-env"]
    image: redis:8.10.0@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Copy .env.example to .env and replace every placeholder}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru --save '' --appendonly no
    ports:
      - "127.0.0.1:18379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    stop_grace_period: 15s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  kafka:
    profiles: ["isolated-env"]
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: then-kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://127.0.0.1:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://127.0.0.1:18992,INTERNAL://then-kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:18992:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:9094"]
      interval: 5s
      timeout: 10s
      retries: 30
    stop_grace_period: 30s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  minio_data:
  kafka_data:

networks:
  default:
    driver: bridge
